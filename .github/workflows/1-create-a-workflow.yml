import requests
import time

Grundgrejen - hämta lagersaldo från leverantören
response = requests.get("https://leverantoren.se/api/products", 
                      headers={"Authorization": "Bearer DIN_API_NYCKEL_HÄR"})

if response.status_code != 200:
    print(f"Fan, något gick fel! Felkod: {response.status_code}")
    exit()

produkter = response.json()

Loopa igenom och uppdatera ditt lager
for produkt in produkter:
    artikelnr = produkt.get("sku", "")
    lagersaldo = produkt.get("stock", 0)

Här uppdaterar du din webshop (WooCommerce exempel)
    shop_url = f"https://dinbutik.se/wp-json/wc/v3/products/?sku={artikelnr}"
    shop_auth = ("consumer_key", "consumer_secret")

    shop_update = {
        "stock_quantity": lagersaldo,
        "manage_stock": True
    }

    shop_response = requests.put(shop_url, auth=shop_auth, json=shop_update)

Chilla lite mellan requests så du inte blir blockad
    time.sleep(0.5)

print("Klart! Lagret är uppdaterat.")
